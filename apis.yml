aid: sonrai-security
name: Sonrai Security
description: >-
  Sonrai Security is a cloud identity and access security company whose Cloud
  Permissions Firewall (CPF) enforces least-privilege access across AWS, Azure,
  and Google Cloud by quarantining unused IAM identities, protecting sensitive
  permissions, and disabling unused services and regions without disrupting
  developers. The platform also ships WALLy, an AI-driven Cloud PAM agent that
  grants just-in-time privileged access through Slack and Teams, and offers
  agentic AI security consulting. Sonrai exposes a GraphQL API for the platform
  (endpoint https://app.sonraisecurity.com/graphql), documented in its CPF
  developer docs; platform and API access authenticate through an Auth0-backed
  OpenID Connect identity provider at login.sonraisecurity.com. Sonrai Security
  is backed by Menlo Ventures.
